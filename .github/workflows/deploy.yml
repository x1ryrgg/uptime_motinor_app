name: CI/CD Microservices

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy-monitors:
    # Запускаем джобу ТОЛЬКО если изменилось что-то в папке /monitors
    paths:
      - 'monitors/**'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: x1ryrg
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Monitors Image
        uses: docker/build-push-action@v5
        with:
          context: ./monitors
          file: ./monitors/Dockerfile
          push: true
          tags: mydockerhub/monitors:${{ github.sha }}

      - name: Deploy to Server B via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_B_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app/monitors
            docker pull mydockerhub/monitors:${{ github.sha }}
            # Обновляем имя образа и перезапускаем
            docker compose up -d