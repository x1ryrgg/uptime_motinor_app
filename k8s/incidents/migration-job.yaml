apiVersion: batch/v1
kind: Job
metadata:
  name: incidents-migration
  namespace: uptime-monitor
spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: incidents-migration

    spec:
      restartPolicy: OnFailure

      containers:
        - name: migration
          image: uptimemonitor-incidents_web:latest
          imagePullPolicy: Never

          command:
            - python
            - manage.py
            - migrate
            - --noinput

          envFrom:
            - configMapRef:
                name: common-config
            - secretRef:
                name: common-secret
            - configMapRef:
                name: incidents-config
            - secretRef:
                name: incidents-secret