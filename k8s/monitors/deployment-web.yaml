apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitors-web
  namespace: uptime-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitors-web
  template:
    metadata:
      labels:
        app: monitors-web
    spec:
      containers:
        - name: monitors-web
          image: uptimemonitor-monitors_web:latest
          imagePullPolicy: Never

          command:
            - gunicorn
            - config.wsgi:application
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "2"

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: common-config
            - secretRef:
                name: common-secret
            - configMapRef:
                name: monitors-config
            - secretRef:
                name: monitors-secret

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20