apiVersion: v1
kind: ConfigMap
metadata:
  name: monitors-config
  namespace: uptime-monitor
data:
  DB_NAME: "uptimer_monitors"

  DJANGO_ALLOWED_HOSTS: "monitors.localhost,localhost,127.0.0.1"

  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"

  CSRF_TRUSTED_ORIGINS: "http://monitors.localhost"

  PROBES_GRPC_HOST: "probes-grpc:50052"