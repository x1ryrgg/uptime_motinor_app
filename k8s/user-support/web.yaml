apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-support-web
  namespace: uptime-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-support-web
  template:
    metadata:
      labels:
        app: user-support-web
    spec:
      containers:
        - name: user-support-web
          image: uptimemonitor-user_support_web:latest
          imagePullPolicy: Never

          command:
            - gunicorn
            - config.wsgi:application
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "2"

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: common-config
            - secretRef:
                name: common-secret
            - configMapRef:
                name: user-support-config
            - secretRef:
                name: user-support-secret

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: user-support-web
  namespace: uptime-monitor
spec:
  selector:
    app: user-support-web
  ports:
    - name: http
      port: 8000
      targetPort: http