apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-worker
  namespace: uptime-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-worker
  template:
    metadata:
      labels:
        app: notifications-worker
    spec:
      containers:
        - name: notifications-worker
          image: uptimemonitor-notifications_worker:latest
          imagePullPolicy: Never

          command:
            - celery
            - -A
            - config
            - worker
            - --loglevel=info

          envFrom:
            - configMapRef:
                name: common-config
            - secretRef:
                name: common-secret
            - configMapRef:
                name: notifications-config
            - secretRef:
                name: notifications-secret