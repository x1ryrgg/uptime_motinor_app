apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: uptime-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq

    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine

          ports:
            - name: amqp
              containerPort: 5672

            - name: management
              containerPort: 15672

          envFrom:
            - secretRef:
                name: rabbitmq-secret

          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 20
            periodSeconds: 10