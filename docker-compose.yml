services:

  # ============================================================
  # INFRASTRUCTURE
  # ============================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    ports:
      - "${RABBITMQ_MGMT_PORT}:15672"

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MONITORING
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped

    ports:
      - "${PROMETHEUS_PORT}:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  loki:
    image: grafana/loki:2.9.4
    restart: unless-stopped

    ports:
      - "${LOKI_PORT}:3100"

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.4
    restart: unless-stopped

    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - "-config.file=/etc/promtail/config.yml"

    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped

    ports:
      - "${GRAFANA_PORT}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus
      - loki

  # ==========================================
  # МИКРОСЕРВИС: USER_SUPPORT
  # ==========================================
  user_support_web:
    build:
      context: .
      dockerfile: ./user_support/Dockerfile

    env_file:
      - ./user_support/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1

      USER_SUPPORT_GRPC_PORT: 50051

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8001
      "

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  user_support_grpc:
    build:
      context: .
      dockerfile: ./user_support/Dockerfile

    env_file:
      - ./user_support/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      USER_SUPPORT_GRPC_PORT: 50051

    command: python grpc_server.py

    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # MONITORS
  # ============================================================
  monitors_web:
    build:
      context: .
      dockerfile: ./monitors/Dockerfile

    env_file:
      - ./monitors/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1

      PROBES_GRPC_HOST: probes_grpc:50052

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8002
      "

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  monitors_beat:
    build:
      context: .
      dockerfile: ./monitors/Dockerfile

    env_file:
      - ./monitors/.env

    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    command: celery -A config beat -l info

    depends_on:
      rabbitmq:
        condition: service_healthy

  monitors_worker:
    build:
      context: .
      dockerfile: ./monitors/Dockerfile

    env_file:
      - ./monitors/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1

      PROBES_GRPC_HOST: probes_grpc:50052

    command: celery -A config worker -l info -Q monitors_queue,celery

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # PROBES
  # ============================================================
  probes_grpc:
    build:
      context: .
      dockerfile: ./probes/Dockerfile

    env_file:
      - ./probes/.env

    environment:
      PROBE_GRPC_PORT: 50052
      PYTHONUNBUFFERED: 1

    command: python grpc_server.py

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # ============================================================
  # INCIDENTS
  # ============================================================
  incidents_web:
    build:
      context: .
      dockerfile: ./incidents/Dockerfile

    env_file:
      - ./incidents/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1

      USER_SUPPORT_GRPC_HOST: user_support_grpc:50051

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8003
      "

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  incidents_worker:
    build:
      context: .
      dockerfile: ./incidents/Dockerfile

    env_file:
      - ./incidents/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      USER_SUPPORT_GRPC_HOST: user_support_grpc:50051

    command: celery -A config worker -l info -Q incidents_queue

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user_support_grpc:
        condition: service_started

  # ============================================================
  # NOTIFICATIONS
  # ============================================================
  notifications_web:
    build:
      context: .
      dockerfile: ./notifications/Dockerfile

    env_file:
      - ./notifications/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8004
      "

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  notifications_worker:
    build:
      context: .
      dockerfile: ./notifications/Dockerfile

    env_file:
      - ./notifications/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    command: celery -A config worker -l info -Q notifications_queue

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # NGINX
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "${NGINX_PORT}:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - user_support_web
      - monitors_web
      - incidents_web
      - notifications_web

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data: